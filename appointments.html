<!-- Hey everyone. My project is supposed to be a website for a car electritian shop -->
<!-- My elements are <fieldset>, <datalist>, <optgroup> and my attributes are autocomplete,  minlength, loop-->


<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=0.8, maximum-scale=1.2">
        <title>Make an Appointment</title>
            <link href="_css/styles.css" rel="stylesheet">
        </head>

        <body>
            <header class="site-header">
                <!-- Left side: Logo to main -->
                <a href="index.html">
                    <img
                        src="images/Rai-automotive-logo.png"
                        alt="Rai Automotive home"
                        class="logo"
                    >
                </a>

                <!-- Right side: menu and search -->
                <div class="header-tools">
                    
                    <div class="site-search">
                        <details>
                            <summary aria-label="Open search bar">🔍︎</summary>
                            <input
                                type="search"
                                id="site-search"
                                name="q"
                                placeholder="Search the website"
                            >
                        </details>
                    </div>
                    
                    <nav>
                        <!-- Create a dropdown menu for pages -->
                        <details class="page-menu">
                            <summary aria-label="Open navigation menu">☰</summary>

                            <div class="page-list">
                                <ul>
                                    <div><li><a href="index.html" title="Home">Home</a></li></div>
                                    <div><li><a href="services.html">Services</a></li></div>
                                    <div><li><a href="appointments.html" title="Make an appointment">Appointments</a></li></div>
                                    <div><li><a href="contact.html" title="Contact Rai Automotive">Contact</a></li></div>
                                </ul>
                            </div>
                        </details>
                    </nav>

                </div>

            </header>

            <main>
                <h1>Request a Service</h1>

                <p>Tell us about your vehicle and how we can help.</p>

                <form id="service-form">

                    <!-- MY ELEMENT: fieldset groups related form fields together. -->
                    <fieldset>
                        <legend>Vehicle Information</legend>

                        <p>
                            <label for="make">Car make (brand):</label>

                            <select id="make" name="make" required>
                                <option value="">Choose your car brand</option>

                                <!-- MY ELEMENT: optgroup organizes dropdown options under a heading given by its label attribute. -->
                                <optgroup label="European Brands">
                                    <option>BMW</option>
                                    <option>Mercedes-Benz</option>
                                    <option>MINI</option>
                                    <option>Rolls-Royce</option>
                                    <option>Audi</option>
                                    <option>Porsche</option>
                                </optgroup>

                                <optgroup label="Other Brands">
                                    <option>Toyota</option>
                                    <option>Honda</option>
                                    <option>Kia</option>
                                    <option>Ford</option>
                                    <option>Other</option>
                                </optgroup>
                            </select>
                        </p>

                        <p>
                            <label for="model">Car model:</label>

                            <input
                                type="text"
                                id="model"
                                name="model"
                                list="model-suggestions"
                                placeholder="For example, C300"
                                required
                            >

                            <!-- MY ELEMENT: datalist provides suggestions for the connected input. Customers can also type another model. This feature is not Baseline because it is limited in availability and does not work on firefox -->
                            <datalist id="model-suggestions">
                                <option value="C 300">
                                <option value="330i">
                                <option value="Cooper">
                                <option value="Ghost">
                            </datalist>
                        </p>

                        <p>
                            <label for="year">Model year:</label>

                            <input
                                type="number"
                                id="year"
                                name="year"
                                min="1980"
                                step="1"
                                placeholder="For example, 2024"
                                required
                            >
                        </p>
                    </fieldset>

                    <fieldset>
                        <legend>Problem and Contact Information</legend>

                        <p>
                            <label for="problem">
                                Describe the problem (at least 20 characters):
                            </label>

                            <!-- MY ATTRIBUTE: minlength requires at least 20 characters. required also prevents the field from being left empty. -->
                            <textarea
                                id="problem"
                                name="problem"
                                rows="5"
                                minlength="20"
                                required
                            ></textarea>
                        </p>

                        <p>
                            <label for="phone">Phone number:</label>

                            <!-- MY ATTRIBUTE: autocomplete="tel" lets the browser offer a saved phone number for this field. -->
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                autocomplete="tel"
                                placeholder="For example, 818-555-0123"
                                required
                            >
                        </p>
                    </fieldset>

                    <button type="submit">Submit Request</button>
                </form>

                <p id="confirmation" role="status"></p>
            </main>
            <footer class="site-footer">
                <p><a href="https://www.instagram.com/rai.automotive/" title="Rai Automotive on Instagram" target="_blank"><img src="images/insta.png" alt="Instagram"></a></p>
                <p class="footer-link"><a href="contact.html" title="Contact Rai Automotive">Contact Us</a></p>
                <p class="footer-link"><a href="appointments.html" title="Make an appointment">Make an Appointment</a></p>
                <p><address>9035 Eton Ave, Suite B,<br> Canoga Park, CA 91304 <br> United States</address></p>
            </footer>
        </body>
        


    </html>
